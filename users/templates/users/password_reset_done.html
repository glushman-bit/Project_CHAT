{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Письмо отправлено</title>
    <link
        rel="stylesheet"
        href="{% static 'users/css/password.css' %}"
    >
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Письмо отправлено</h1>

        <p class="auth-hint">
            Если аккаунт с таким email существует, мы отправили
            на него ссылку для восстановления пароля.
        </p>

        <p class="auth-hint">
            Ссылка действует ограниченное время. Проверьте
            также папку «Спам».
        </p>

        <a
            class="auth-back"
            href="{% url 'first_chat' %}"
        >
            Вернуться в чат
        </a>

    </div>

</div>

</body>

</html>
